name: Ana Keyboard APK

on:
  push:
    branches: [main]
    paths:
      - 'android-keyboard/**'
      - '.github/workflows/ana-keyboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Ana launcher icon
        run: |
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi
          base64 --decode android-keyboard/app/icon/ana_keyboard_icon.b64 > android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png

      - name: Build debug APK
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ana-keyboard-debug
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
