name: Ana fast typing fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ana-fast-typing-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch fast typing hot path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          view_path = Path('android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardView.kt')
          s = view_path.read_text()

          anchor = '    private var spaceCursorAnchorX = 0f\n'
          insert = '''    private var spaceCursorAnchorX = 0f
    private data class PointerPress(val item: PlacedKey, val downX: Float, val downY: Float)
    private val pointerPresses = mutableMapOf<Int, PointerPress>()
    private var primaryPointerId = -1
    private val calibrationSaveHandler = Handler(Looper.getMainLooper())
    private val persistCalibrationLater = Runnable { persistTouchCalibration() }
'''
          if 'private data class PointerPress' not in s:
              assert anchor in s
              s = s.replace(anchor, insert, 1)

          old = '''        touchCalibration[key] = next
        calibrationDirty++
        if (calibrationDirty >= 16) persistTouchCalibration()
'''
          new = '''        touchCalibration[key] = next
        calibrationDirty++
        // Never serialize calibration while the user is actively typing.
        // Save only after an idle window so touch delivery stays smooth.
        calibrationSaveHandler.removeCallbacks(persistCalibrationLater)
        calibrationSaveHandler.postDelayed(persistCalibrationLater, 1800)
'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        glideLetters.clear()
        spaceCursorMoved = false
    }

    override fun onTouchEvent(event: MotionEvent): Boolean {
'''
          new = '''        glideLetters.clear()
        spaceCursorMoved = false
        pointerPresses.clear()
        primaryPointerId = -1
    }

    override fun onTouchEvent(event: MotionEvent): Boolean {
'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                downAt = SystemClock.uptimeMillis()
                active = keyAt(event.x, event.y)
                alternatePopup = null
'''
          new = '''                downAt = SystemClock.uptimeMillis()
                primaryPointerId = event.getPointerId(0)
                pointerPresses.clear()
                active = keyAt(event.x, event.y)
                active?.let { pointerPresses[primaryPointerId] = PointerPress(it, event.x, event.y) }
                alternatePopup = null
'''
          assert old in s
          s = s.replace(old, new, 1)

          # Replace the immediate space-drag cursor behavior with a deliberate hold+drag.
          old = '''                if (active?.key?.code == "SPACE") {
                    val step = dp(17f)
                    val rawSteps = ((event.x - spaceCursorAnchorX) / step).toInt().coerceIn(-6, 6)
                    if (rawSteps != 0) {
                        val code = if (rawSteps > 0) "CURSOR_RIGHT" else "CURSOR_LEFT"
                        repeat(kotlin.math.abs(rawSteps)) { listener?.onKey(code) }
                        spaceCursorAnchorX += rawSteps * step
                        spaceCursorMoved = true
                        longPressHandler.removeCallbacks(showAlternates)
                    }
                    return true
                }
'''
          new = '''                if (active?.key?.code == "SPACE") {
                    val heldLongEnough = event.eventTime - downAt >= 160L
                    val movedFromDown = abs(event.x - downX)
                    if (!spaceCursorMoved) {
                        if (!heldLongEnough || movedFromDown < dp(10f)) return true
                        spaceCursorMoved = true
                        spaceCursorAnchorX = event.x
                        longPressHandler.removeCallbacks(showAlternates)
                    }
                    val step = dp(17f)
                    val rawSteps = ((event.x - spaceCursorAnchorX) / step).toInt().coerceIn(-6, 6)
                    if (rawSteps != 0) {
                        val code = if (rawSteps > 0) "CURSOR_RIGHT" else "CURSOR_LEFT"
                        repeat(kotlin.math.abs(rawSteps)) { listener?.onKey(code) }
                        spaceCursorAnchorX += rawSteps * step
                    }
                    return true
                }
'''
          assert old in s
          s = s.replace(old, new, 1)

          # Add true multi-touch capture. Fast two-thumb typing creates POINTER events;
          # ignoring them is what caused dropped characters.
          marker = '''            MotionEvent.ACTION_MOVE -> {
'''
          pointer_down = '''            MotionEvent.ACTION_POINTER_DOWN -> {
                val index = event.actionIndex
                val pointerId = event.getPointerId(index)
                val x = event.getX(index)
                val y = event.getY(index)
                val item = keyAt(x, y)
                if (item != null) {
                    pointerPresses[pointerId] = PointerPress(item, x, y)
                    listener?.onPressFeedback(this)
                }
                return true
            }

            MotionEvent.ACTION_MOVE -> {
'''
          if 'MotionEvent.ACTION_POINTER_DOWN ->' not in s:
              assert marker in s
              s = s.replace(marker, pointer_down, 1)

          start = s.index('            MotionEvent.ACTION_UP -> {')
          end = s.index('            MotionEvent.ACTION_CANCEL -> {', start)
          replacement = '''            MotionEvent.ACTION_POINTER_UP -> {
                val index = event.actionIndex
                val pointerId = event.getPointerId(index)
                val upX = event.getX(index)
                val upY = event.getY(index)
                val press = pointerPresses.remove(pointerId)

                if (pointerId == primaryPointerId) {
                    repeatHandler.removeCallbacks(repeatBackspace)
                    longPressHandler.removeCallbacks(showAlternates)
                    val selected = press?.item ?: active
                    val popup = alternatePopup
                    if (selected != null) {
                        if (popup != null) {
                            if (popup.selectedIndex >= 0) listener?.onKey(popup.options[popup.selectedIndex])
                            else listener?.onKey(selected.key.code)
                        } else if (selected.key.code == "SPACE" && spaceCursorMoved) {
                            // Cursor-control gesture: do not insert a space.
                        } else if (selected.key.code != "BACKSPACE" || !backspaceRepeated) {
                            listener?.onKey(selected.key.code)
                            recordSuccessfulTouch(selected, upX, upY)
                        }
                        performClick()
                    }
                    active = null
                    alternatePopup = null
                    backspaceRepeated = false
                    spaceCursorMoved = false
                    primaryPointerId = -1
                } else if (press != null) {
                    val movement = hypot(upX - press.downX, upY - press.downY)
                    val tapLimit = max(dp(22f), touchSlop * 2.4f)
                    // Secondary fingers are ordinary tap input. This is the key path
                    // for fast two-thumb typing; never run long-press/glide work here.
                    if (movement <= tapLimit && press.item.key.code.length == 1) {
                        listener?.onKey(press.item.key.code)
                    }
                }
                invalidate()
                return true
            }

            MotionEvent.ACTION_UP -> {
                repeatHandler.removeCallbacks(repeatBackspace)
                longPressHandler.removeCallbacks(showAlternates)
                val index = event.actionIndex
                val pointerId = event.getPointerId(index)
                val press = pointerPresses.remove(pointerId)

                if (gliding && pointerId == primaryPointerId) {
                    appendGlide(glideKeyAt(event.x, event.y), event.x, event.y)
                    val sequence = glideLetters.joinToString("")
                    val trace = buildGlideTrace(sequence)
                    fadeTrail()
                    if (sequence.length >= 2) listener?.onGlide(trace)
                    performClick()
                    clearPressState()
                    invalidate()
                    return true
                }

                val selected = press?.item ?: active
                if (selected != null) {
                    if (pointerId == primaryPointerId) {
                        val popup = alternatePopup
                        if (popup != null) {
                            if (popup.selectedIndex >= 0) listener?.onKey(popup.options[popup.selectedIndex])
                            else listener?.onKey(selected.key.code)
                        } else if (selected.key.code == "SPACE" && spaceCursorMoved) {
                            // A held horizontal spacebar drag is cursor control, not Space.
                        } else if (selected.key.code != "BACKSPACE" || !backspaceRepeated) {
                            listener?.onKey(selected.key.code)
                            recordSuccessfulTouch(selected, event.x, event.y)
                        }
                    } else {
                        val movement = press?.let { hypot(event.x - it.downX, event.y - it.downY) } ?: 0f
                        val tapLimit = max(dp(22f), touchSlop * 2.4f)
                        if (movement <= tapLimit && selected.key.code.length == 1) listener?.onKey(selected.key.code)
                    }
                    performClick()
                }
                clearPressState()
                invalidate()
                return true
            }

'''
          s = s[:start] + replacement + s[end:]

          old = '''        repeatHandler.removeCallbacksAndMessages(null)
        longPressHandler.removeCallbacksAndMessages(null)
        trailAnimator?.cancel()
        persistTouchCalibration()
'''
          new = '''        repeatHandler.removeCallbacksAndMessages(null)
        longPressHandler.removeCallbacksAndMessages(null)
        calibrationSaveHandler.removeCallbacksAndMessages(null)
        trailAnimator?.cancel()
        persistTouchCalibration()
'''
          assert old in s
          s = s.replace(old, new, 1)
          view_path.write_text(s)

          service_path = Path('android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardService.kt')
          t = service_path.read_text()

          anchor = '    private var shortcutCache: Map<String, String> = emptyMap()\n'
          insert = '''    private var shortcutCache: Map<String, String> = emptyMap()
    // Cached hot-path settings: no SharedPreferences lookup on every key tap.
    private var fastHapticEnabled = true
    private var fastHapticStrengthMs = 6
    private var fastSoundEnabled = true
    private var wordSuggestionsEnabledCached = true
    private var smartSentenceEnabledCached = false
'''
          if 'private var fastHapticEnabled' not in t:
              assert anchor in t
              t = t.replace(anchor, insert, 1)

          old = '''    override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
        super.onStartInputView(info, restarting)
        stopVoiceTyping(false)
'''
          new = '''    override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
        super.onStartInputView(info, restarting)
        // Snapshot settings once per input session so the key path stays tiny.
        fastHapticEnabled = KeyboardPrefs.hapticEnabled(this)
        fastHapticStrengthMs = KeyboardPrefs.hapticStrengthMs(this)
        fastSoundEnabled = KeyboardPrefs.soundEnabled(this)
        wordSuggestionsEnabledCached = KeyboardPrefs.wordSuggestionsEnabled(this)
        smartSentenceEnabledCached = KeyboardPrefs.smartSentenceCorrectionEnabled(this)
        stopVoiceTyping(false)
'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''    override fun onPressFeedback(view: View) {
        if (KeyboardPrefs.hapticEnabled(this)) {
            vibrator.vibrate(
                VibrationEffect.createOneShot(
                    KeyboardPrefs.hapticStrengthMs(this).toLong(),
                    VibrationEffect.DEFAULT_AMPLITUDE
                )
            )
        }
        if (KeyboardPrefs.soundEnabled(this)) audioManager.playSoundEffect(AudioManager.FX_KEY_CLICK, 0.34f)
    }
'''
          new = '''    override fun onPressFeedback(view: View) {
        if (fastHapticEnabled) {
            vibrator.vibrate(
                VibrationEffect.createOneShot(
                    fastHapticStrengthMs.toLong(),
                    VibrationEffect.DEFAULT_AMPLITUDE
                )
            )
        }
        if (fastSoundEnabled) audioManager.playSoundEffect(AudioManager.FX_KEY_CLICK, 0.34f)
    }
'''
          assert old in t
          t = t.replace(old, new, 1)

          # Stop reading the editor and rebuilding suggestion cells on every letter.
          # The existing debounced suggestion runnable updates the strip after the user pauses.
          t = t.replace('''                refreshShiftFromEditor()\n                showTypedWordCandidate()\n                requestSuggestionsSoon()\n''', '''                refreshShiftFromEditor()\n                requestSuggestionsSoon()\n''', 1)
          t = t.replace('''                if (typed.any { it.isLetter() }) {\n                    showTypedWordCandidate()\n                    requestSuggestionsSoon()\n''', '''                if (typed.any { it.isLetter() }) {\n                    requestSuggestionsSoon()\n''', 1)

          old = '''    private fun requestSuggestionsSoon() {
        mainHandler.removeCallbacks(suggestionRunnable)
        if (!KeyboardPrefs.wordSuggestionsEnabled(this) || isPasswordField()) {
'''
          new = '''    private fun requestSuggestionsSoon() {
        mainHandler.removeCallbacks(suggestionRunnable)
        if (!wordSuggestionsEnabledCached || isPasswordField()) {
'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''    private fun scheduleSmartSentenceCorrection() {
        smartSentenceToken++
        mainHandler.removeCallbacks(smartSentenceRunnable)
        if (!KeyboardPrefs.smartSentenceCorrectionEnabled(this) || isPasswordField()) return
        mainHandler.postDelayed(smartSentenceRunnable, 950)
    }
'''
          new = '''    private fun scheduleSmartSentenceCorrection() {
        if (!smartSentenceEnabledCached || isPasswordField()) return
        smartSentenceToken++
        mainHandler.removeCallbacks(smartSentenceRunnable)
        mainHandler.postDelayed(smartSentenceRunnable, 950)
    }
'''
          assert old in t
          t = t.replace(old, new, 1)

          # Avoid sentence-correction handler churn on every key when the feature is off.
          old = '''        // Any new key cancels an older sentence check/result. Space or punctuation
        // will schedule a fresh check after the key is committed.
        smartSentenceToken++
        mainHandler.removeCallbacks(smartSentenceRunnable)
'''
          new = '''        // Any new key cancels an older sentence check/result only when that feature is active.
        if (smartSentenceEnabledCached) {
            smartSentenceToken++
            mainHandler.removeCallbacks(smartSentenceRunnable)
        }
'''
          assert old in t
          t = t.replace(old, new, 1)
          service_path.write_text(t)

          gradle = Path('android-keyboard/app/build.gradle.kts')
          g = gradle.read_text()
          g = re.sub(r'versionCode = \d+', 'versionCode = 10', g, count=1)
          g = re.sub(r'versionName = "[^"]+"', 'versionName = "0.9.1"', g, count=1)
          gradle.write_text(g)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare build assets
        run: |
          set -euo pipefail
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi android-keyboard/app/src/main/assets
          base64 --decode android-keyboard/app/icon/ana_keyboard_icon.b64 > android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt -o /tmp/en_50k.txt
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/de/de_50k.txt -o /tmp/de_50k.txt
          head -n 30000 /tmp/en_50k.txt > android-keyboard/app/src/main/assets/en_freq.txt
          head -n 30000 /tmp/de_50k.txt > android-keyboard/app/src/main/assets/de_freq.txt

      - name: Build keyboard
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardView.kt android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardService.kt android-keyboard/app/build.gradle.kts
          git commit -m 'Ana Keyboard v0.9.1 fast typing fix [skip ci]'
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ana-keyboard-v0.9.1-fast-typing
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
