name: Validate realtime meeting

on:
  push:
    paths:
      - 'src/MeetingMode.jsx'
      - 'src/meeting.css'
      - '.github/workflows/validate-realtime-meeting.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
