name: KLIPY diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/klipy-diagnostic.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check KLIPY v2
        run: |
          set +e
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP=%{http_code}\n' 'https://api.klipy.com/v2/featured?key=sandbox-mJokm7E2jH&searchfilter=gif&locale=en_US&contentfilter=medium&media_filter=gif,tinygif&limit=2'
          cat /tmp/headers.txt
          head -c 800 /tmp/body.txt; echo
