name: Ana keyboard fluidity pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-keyboard-fluidity-pass.py'
      - '.github/workflows/keyboard-fluidity-pass.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare launcher icon
        run: |
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi
          base64 --decode android-keyboard/app/icon/ana_keyboard_icon.b64 > android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png
      - name: Prepare offline correction dictionaries
        run: |
          set -euo pipefail
          mkdir -p android-keyboard/app/src/main/assets
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt -o /tmp/en_50k.txt
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/de/de_50k.txt -o /tmp/de_50k.txt
          head -n 30000 /tmp/en_50k.txt > android-keyboard/app/src/main/assets/en_freq.txt
          head -n 30000 /tmp/de_50k.txt > android-keyboard/app/src/main/assets/de_freq.txt
      - name: Apply fluidity pass
        run: |
          python3 scripts/apply-keyboard-fluidity-pass.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardView.kt')
          s = p.read_text()
          s = s.replace('        fun onReplaceLastKey(text: String)\n', '        fun onReplaceLastKey(text: String) {}\n', 1)
          p.write_text(s)
          PY
      - name: Build keyboard
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit fluidity changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-keyboard/app/build.gradle.kts \
            android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardView.kt \
            android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardService.kt
          git commit -m "Make Ana keyboard capture fast overlapping taps" || exit 0
          git push
