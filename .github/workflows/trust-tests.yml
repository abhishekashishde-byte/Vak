name: Ana trust tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Talk for Me adversarial trust tests
        run: npm run test:trust
      - name: Production build
        run: npm run build
