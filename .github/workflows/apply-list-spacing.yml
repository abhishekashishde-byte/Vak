name: Apply list spacing

on:
  push:
    paths:
      - '.github/workflows/apply-list-spacing.yml'
      - 'scripts/improve-list-spacing.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node scripts/improve-list-spacing.mjs
      - run: npm install && npm run build
      - run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Improve bullet list spacing in translation'
          git push origin main
