name: Improve meeting readability

on:
  push:
    paths:
      - '.github/workflows/improve-meeting-readability.yml'
      - 'scripts/improve-meeting-readability.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply meeting readability improvements
        run: node scripts/improve-meeting-readability.mjs
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit meeting improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MeetingMode.jsx src/meeting.css api/meeting-segment.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make meeting transcript readable for users'
          git push origin main
