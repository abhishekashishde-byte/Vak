name: Expand Ana languages

on:
  push:
    paths:
      - 'scripts/expand-languages.mjs'
      - '.github/workflows/expand-languages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply language expansion
        run: node scripts/expand-languages.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Expand Ana language support"
          git push
