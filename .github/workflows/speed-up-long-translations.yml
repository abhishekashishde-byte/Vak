name: Speed up long translations

on:
  push:
    paths:
      - '.github/workflows/speed-up-long-translations.yml'
      - 'scripts/speed-up-long-translations.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply speed improvements
        run: node scripts/speed-up-long-translations.mjs
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx api/translate.js
          git diff --cached --quiet && exit 0
          git commit -m 'Speed up long translations'
          git push origin main
