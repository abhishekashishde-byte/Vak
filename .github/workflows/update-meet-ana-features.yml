name: Update Meet Ana features

on:
  push:
    paths:
      - '.github/workflows/update-meet-ana-features.yml'
      - 'scripts/update-meet-ana-features.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh Meet Ana page
        run: node scripts/update-meet-ana-features.mjs

      - name: Validate production build
        run: |
          npm install
          npm run build

      - name: Commit Meet Ana refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/meet-ana/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Meet Ana for new features'
          git push origin main
