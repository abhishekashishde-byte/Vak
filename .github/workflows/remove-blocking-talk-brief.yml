name: Remove blocking Talk briefing

on:
  push:
    paths:
      - 'scripts/remove-blocking-talk-brief.mjs'
      - '.github/workflows/remove-blocking-talk-brief.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-blocking Talk briefing fix
        run: node scripts/remove-blocking-talk-brief.mjs
      - name: Install
        run: npm install
      - name: Trust tests
        run: npm run test:trust
      - name: Production build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TalkForMeRealtime.jsx api/translate.js
          git diff --cached --quiet && exit 0
          git commit -m "Make Talk briefing instant and non-blocking"
          git push
