name: Apply Ana Keyboard v0.9 feature pack

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-keyboard-v09.py'
      - '.github/workflows/apply-keyboard-v09.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.9 changes
        run: python3 scripts/apply-keyboard-v09.py
      - name: Validate GIF server function
        run: node --check api/gifs.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare launcher icon and offline dictionaries
        run: |
          set -euo pipefail
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi android-keyboard/app/src/main/assets
          base64 --decode android-keyboard/app/icon/ana_keyboard_icon.b64 > android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt -o /tmp/en_50k.txt
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/de/de_50k.txt -o /tmp/de_50k.txt
          head -n 30000 /tmp/en_50k.txt > android-keyboard/app/src/main/assets/en_freq.txt
          head -n 30000 /tmp/de_50k.txt > android-keyboard/app/src/main/assets/de_freq.txt
      - name: Build v0.9 debug APK
        working-directory: android-keyboard
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit tested v0.9 sources
        run: |
          set -euo pipefail
          rm -f scripts/apply-keyboard-v09.py .github/workflows/apply-keyboard-v09.yml .github/workflows/klipy-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- android-keyboard/app/src/main/assets/en_freq.txt android-keyboard/app/src/main/assets/de_freq.txt android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png || true
          git commit -m "Ana Keyboard v0.9 privacy and ergonomics pack"
          git push
