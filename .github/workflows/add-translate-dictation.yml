name: Add Translate voice dictation

on:
  push:
    paths:
      - 'scripts/add-translate-dictation.mjs'
      - '.github/workflows/add-translate-dictation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Translate dictation patch
        run: node scripts/add-translate-dictation.mjs
      - name: Install
        run: npm install
      - name: Trust tests
        run: npm run test:trust
      - name: Production build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Add voice typing to Translate"
          git push
