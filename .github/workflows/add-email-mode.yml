name: Update Ana Write for me mode

on:
  push:
    paths:
      - '.github/workflows/add-email-mode.yml'
      - 'scripts/add-email-mode.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Ana Write for me mode
        run: node scripts/add-email-mode.mjs

      - name: Validate production build
        run: |
          npm install
          npm run build

      - name: Commit Ana Write for me mode
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Email with Write for me in Ana'
          git push origin main
