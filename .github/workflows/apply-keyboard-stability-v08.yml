name: Apply Ana Keyboard v0.8 stability patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-keyboard-stability-v08.py'
      - '.github/workflows/apply-keyboard-stability-v08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stability patch
        run: python3 scripts/apply-keyboard-stability-v08.py
      - name: Verify web build
        run: npm install --no-audit --no-fund && npm run build
      - name: Verify Android build
        run: |
          cd android-keyboard
          ./gradlew assembleDebug --no-daemon
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-keyboard/app/src/main/java/com/ana/keyboard/KeyboardPrefs.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/MainActivity.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardService.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/GifPickerActivity.kt \
                  android-keyboard/app/build.gradle.kts api/translate.js
          git commit -m "Stabilize Ana typing and sentence correction" || exit 0
          git push

# Trigger marker: v0.8 stability pass
