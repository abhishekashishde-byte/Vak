name: Fix translate layout and glossary

on:
  push:
    paths:
      - '.github/workflows/fix-translate-layout-glossary.yml'
      - 'scripts/fix-translate-layout-glossary.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fixes
        run: node scripts/fix-translate-layout-glossary.mjs
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/styles.css src/accountPreferences.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix translate scrolling layout and glossary persistence'
          git push origin main
