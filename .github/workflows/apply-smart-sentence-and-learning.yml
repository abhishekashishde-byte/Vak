name: Apply smart sentence correction and learning refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-smart-sentence-and-learning.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ana updates
        run: python3 scripts/apply-smart-sentence-and-learning.py
      - name: Verify web build
        run: npm ci && npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-keyboard/app/src/main/java/com/ana/keyboard/AnaApi.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/AnaKeyboardService.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/KeyboardPrefs.kt \
                  android-keyboard/app/src/main/java/com/ana/keyboard/MainActivity.kt \
                  src/learn.css public/learn/index.html public/meet-ana/index.html \
                  public/developers/index.html public/developers/openapi.json
          git commit -m "Add smart sentence correction and focused Ana learning" || exit 0
          git push
