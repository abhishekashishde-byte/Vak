name: Ana Recorder APK
on:
  push:
    branches: [main]
    paths:
      - 'android-recorder/**'
      - '.github/workflows/ana-recorder-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Ana Recorder
        working-directory: android-recorder
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ana-recorder-debug
          path: android-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
