name: Ana Keyboard Signed Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          ANA_KEYSTORE_BASE64: ${{ secrets.ANA_KEYSTORE_BASE64 }}
          ANA_KEYSTORE_PASSWORD: ${{ secrets.ANA_KEYSTORE_PASSWORD }}
          ANA_KEY_ALIAS: ${{ secrets.ANA_KEY_ALIAS }}
          ANA_KEY_PASSWORD: ${{ secrets.ANA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANA_KEYSTORE_BASE64"
          test -n "$ANA_KEYSTORE_PASSWORD"
          test -n "$ANA_KEY_ALIAS"
          test -n "$ANA_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare generated assets
        run: |
          set -euo pipefail
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi
          base64 --decode android-keyboard/app/icon/ana_keyboard_icon.b64 > android-keyboard/app/src/main/res/drawable-nodpi/ana_keyboard_icon.png
          mkdir -p android-keyboard/app/src/main/assets
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt -o /tmp/en_50k.txt
          curl -fsSL https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/de/de_50k.txt -o /tmp/de_50k.txt
          head -n 30000 /tmp/en_50k.txt > android-keyboard/app/src/main/assets/en_freq.txt
          head -n 30000 /tmp/de_50k.txt > android-keyboard/app/src/main/assets/de_freq.txt

      - name: Prepare release keystore
        env:
          ANA_KEYSTORE_BASE64: ${{ secrets.ANA_KEYSTORE_BASE64 }}
        run: |
          echo "$ANA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ana-release.jks"
          test -s "$RUNNER_TEMP/ana-release.jks"

      - name: Build signed APK and AAB
        working-directory: android-keyboard
        env:
          ANA_KEYSTORE_PATH: ${{ runner.temp }}/ana-release.jks
          ANA_KEYSTORE_PASSWORD: ${{ secrets.ANA_KEYSTORE_PASSWORD }}
          ANA_KEY_ALIAS: ${{ secrets.ANA_KEY_ALIAS }}
          ANA_KEY_PASSWORD: ${{ secrets.ANA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Create SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp android-keyboard/app/build/outputs/apk/release/app-release.apk release/Ana-Keyboard-release.apk
          cp android-keyboard/app/build/outputs/bundle/release/app-release.aab release/Ana-Keyboard-release.aab
          cd release
          sha256sum Ana-Keyboard-release.apk Ana-Keyboard-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: ana-keyboard-signed-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
