<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ana</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="shell">
    <header><div class="mark">A</div><div><h1>Ana</h1><p>Communicate anywhere</p></div></header>
    <section class="card">
      <div class="row between"><label for="selection">Selected text</label><button id="capture" class="link">Capture selection</button></div>
      <textarea id="selection" placeholder="Select text on the page, or paste it here."></textarea>
      <div class="meta"><span id="count">0 characters</span><span id="source"></span></div>
    </section>
    <section class="actions" aria-label="Ana actions">
      <button data-action="translate">Translate</button>
      <button data-action="correct">Correct</button>
      <button data-action="shorter">Shorter</button>
      <button data-action="friendly">Friendly</button>
      <button data-action="formal">Formal</button>
      <button data-action="du">Du</button>
      <button data-action="sie">Sie</button>
      <button data-action="explain">Explain</button>
      <button data-action="reply">Write reply</button>
    </section>
    <section class="settings card">
      <div class="row between"><strong>Ana settings</strong><button id="toggleSettings" class="link">Settings</button></div>
      <div id="settingsBody" hidden>
        <p class="hint">The extension does not call AI directly. It hands the selected text to your signed-in Ana web app. Ana's glossary, Privacy Shield and account settings apply there.</p>
        <label for="appUrl">Ana web app</label>
        <input id="appUrl" type="url" placeholder="https://your-ana-domain.example" autocomplete="url" />
        <label for="projectContext">Project context <small>(optional)</small></label>
        <input id="projectContext" type="text" placeholder="e.g. S/4HANA Transformation" autocomplete="off" />
        <button id="saveUrl" class="save">Save settings</button>
      </div>
      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
