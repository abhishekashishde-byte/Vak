<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="description" content="Ana — Language shouldn’t get in the way." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/ana-app-icon.svg" />
  <link rel="apple-touch-icon" href="/ana-app-icon.svg" />
  <title>Ana — Language shouldn’t get in the way</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Ana behaves like a full-screen app on mobile. Prevent browser pinch gestures
    // from scaling the workspace and making controls disappear off-screen.
    document.addEventListener('gesturestart', function (event) { event.preventDefault() }, { passive: false })
    document.addEventListener('gesturechange', function (event) { event.preventDefault() }, { passive: false })
    document.addEventListener('gestureend', function (event) { event.preventDefault() }, { passive: false })
    document.addEventListener('touchmove', function (event) {
      if (event.touches && event.touches.length > 1) event.preventDefault()
    }, { passive: false })
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
