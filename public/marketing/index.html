<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ana — Language shouldn’t get in the way.</title>
<meta name="description" content="Ana helps you translate, write, reply, understand documents, follow meetings and communicate across languages.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.pexels.com">
<link rel="preload" as="image" href="https://images.pexels.com/photos/27915894/pexels-photo-27915894/free-photo-of-a-close-up-of-a-woman-s-eye-with-a-black-background.jpeg?auto=compress&cs=tinysrgb&w=1600">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4f2ef;
  --dim:#8e8985;
  --line:rgba(244,242,239,.20);
  --pad:clamp(14px,2.7vw,34px);
  --serif:"Playfair Display","Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --safe-top:env(safe-area-inset-top);
  --safe-right:env(safe-area-inset-right);
  --safe-bottom:env(safe-area-inset-bottom);
  --safe-left:env(safe-area-inset-left);
  --cw:148px;
  --persp:1000px;
}
*{box-sizing:border-box}
html{background:#000;scrollbar-gutter:stable}
html,body{margin:0;padding:0}
body{
  background:#000;color:var(--ink);font-family:var(--sans);font-weight:300;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
img{display:block;max-width:100%}
a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{text-decoration:none}
button{border:0;background:none;cursor:pointer}

#scrollTrack{height:1050vh;pointer-events:none}
#scene{position:fixed;inset:0;overflow:hidden;background:#000;z-index:1}
.vig{
  position:absolute;inset:0;z-index:18;pointer-events:none;
  background:radial-gradient(ellipse 92% 92% at 50% 45%,transparent 46%,rgba(0,0,0,.27) 78%,rgba(0,0,0,.80) 100%);
}
.header{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:calc(var(--pad)*.85 + var(--safe-top)) calc(var(--pad) + var(--safe-right)) 0 calc(var(--pad) + var(--safe-left));
  display:flex;align-items:flex-start;justify-content:space-between;
}
.brand{font-family:var(--serif);font-size:clamp(25px,2.7vw,35px);line-height:1}
.try{
  min-height:44px;display:inline-flex;align-items:center;padding:0 18px;
  border:1px solid rgba(244,242,239,.28);border-radius:999px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,239,.76);
  background:rgba(0,0,0,.14);backdrop-filter:blur(7px)
}

/* FIRST VIEW — PHOTOGRAPHIC EYE */
#eyeScreen{
  position:absolute;inset:0;z-index:12;display:grid;place-items:center;
  will-change:opacity;pointer-events:none;
}
#eyeZoom{
  position:absolute;left:50%;top:46%;width:min(1000px,92vw);height:min(68vh,650px);
  transform:translate(-50%,-50%);transform-origin:50% 50%;
  will-change:transform,opacity;
}
#eyePhoto{
  width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  filter:grayscale(.15) saturate(.62) contrast(1.14) brightness(.62);
}
.eyeMask{
  position:absolute;inset:-2px;
  background:
    radial-gradient(ellipse 62% 55% at 50% 50%,transparent 36%,rgba(0,0,0,.16) 57%,rgba(0,0,0,.80) 78%,#000 100%),
    linear-gradient(180deg,#000 0%,transparent 17%,transparent 82%,#000 100%);
  pointer-events:none;
}
.eyeGlow{
  position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 80px rgba(122,111,255,.12),0 0 130px rgba(74,200,183,.08);
  pointer-events:none;
}
.eye-copy{
  position:absolute;left:50%;bottom:calc(8.7vh + var(--safe-bottom));
  transform:translateX(-50%);width:min(92vw,820px);text-align:center;z-index:14;
}
.eye-copy h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(37px,5.6vw,73px);line-height:.97;letter-spacing:-.034em;
}
.eye-copy p{
  margin:15px 0 0;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(244,242,239,.39);
}
.eye-copy p::before{
  content:"";display:inline-block;width:38px;height:1px;margin-right:11px;vertical-align:middle;
  background:rgba(244,242,239,.25)
}

/* GLOBE */
#globeScreen{
  position:absolute;inset:0;z-index:6;opacity:0;pointer-events:none;
  perspective:var(--persp);perspective-origin:50% 41%;
  transition:opacity .20s linear;
}
#globeScreen.visible{pointer-events:auto}
#world{
  position:absolute;left:50%;top:40.5%;width:0;height:0;
  transform-style:preserve-3d;transition:transform .72s var(--ease);
}
#globeScreen.dragging #world{transition:none}
#orb{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.photo-card{
  position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)/1.5);
  margin-left:calc(var(--cw)/-2);margin-top:calc(var(--cw)/-3);
  cursor:pointer;transform-style:preserve-3d;will-change:opacity;
}
.photo-card figure{
  position:absolute;inset:0;margin:0;overflow:hidden;border-radius:3px;background:#080808;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  transition:transform .34s var(--ease),box-shadow .34s ease;
}
.photo-card img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(.72) brightness(.78) contrast(1.04)
}
.photo-card figure::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,var(--d,.24));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);
  pointer-events:none;
}
.photo-card.active figure{
  transform:scale(1.07);
  box-shadow:0 0 34px rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.16)
}
.globe-hint{
  position:absolute;left:50%;top:calc(40.5% + min(33vw,265px));transform:translateX(-50%);
  z-index:9;white-space:nowrap;font-size:8px;letter-spacing:.20em;text-transform:uppercase;
  color:rgba(244,242,239,.30);pointer-events:none
}

/* FEATURE INTRO — ALWAYS AT THE BOTTOM */
#story{
  position:absolute;left:0;right:0;bottom:0;z-index:16;
  padding:0 calc(var(--pad) + var(--safe-right)) calc(var(--pad) + var(--safe-bottom)) calc(var(--pad) + var(--safe-left));
  display:flex;justify-content:center;pointer-events:none;
}
.story{
  width:min(980px,100%);min-height:148px;
  border-top:1px solid rgba(244,242,239,.25);
  display:grid;grid-template-columns:92px minmax(0,.92fr) minmax(0,1.2fr);
  gap:clamp(18px,3vw,42px);padding-top:16px;
  opacity:0;transform:translateY(14px);
  transition:opacity .32s ease,transform .32s ease;
}
#globeScreen.visible .story{opacity:1;transform:none}
.count{font-family:var(--serif);font-size:15px;color:rgba(244,242,239,.50)}
.progress{height:1px;background:rgba(244,242,239,.11);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:#fff;transform-origin:left;transition:transform .22s linear}
.kicker{
  font-size:8px;letter-spacing:.17em;text-transform:uppercase;
  color:rgba(244,242,239,.40);margin-bottom:8px
}
.story h2{
  margin:0;font-family:var(--serif);font-size:clamp(23px,2.7vw,36px);
  font-weight:400;line-height:1.02;letter-spacing:-.018em
}
.story-copy{font-size:12px;line-height:1.62;color:rgba(244,242,239,.73)}
.story-copy small{
  display:block;margin-top:10px;font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(244,242,239,.28)
}
.story.swap .kicker,.story.swap h2,.story.swap .story-copy{opacity:.12;transform:translateY(4px)}
.story .kicker,.story h2,.story .story-copy{transition:opacity .16s ease,transform .16s ease}

/* LIGHTBOX */
#lightbox{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .30s ease;
}
body.lightbox #lightbox{opacity:1;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.plate{position:relative;z-index:2;width:min(78vw,920px);transition:transform .52s var(--ease),opacity .32s ease}
.shot{
  position:relative;width:100%;aspect-ratio:3/2;border-radius:3px;overflow:hidden;
  background:#080808;box-shadow:0 30px 90px rgba(0,0,0,.82)
}
.shot img{width:100%;height:100%;object-fit:cover}
.close{
  position:absolute;right:12px;top:12px;z-index:3;min-width:44px;min-height:44px;
  border:1px solid rgba(255,255,255,.72);border-radius:6px;background:rgba(0,0,0,.35);
  padding:8px 13px;font-size:11px
}
.lbmeta{display:grid;grid-template-columns:.82fr 1.18fr;gap:30px;padding-top:14px}
.lbmeta h2{margin:0 0 6px;font-family:var(--serif);font-size:clamp(24px,2.6vw,35px);font-weight:400;line-height:1.03}
.lbmeta small{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,239,.42)}
.lbmeta p{margin:0;font-size:12.5px;line-height:1.62;color:rgba(244,242,239,.80)}

#dot{
  position:fixed;left:0;top:0;z-index:100;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;
  border-radius:50%;background:rgba(220,218,214,.90);mix-blend-mode:difference;
  border:1px solid transparent;pointer-events:none;
  transition:width .28s ease,height .28s ease,margin .28s ease,background .28s ease,border-color .28s ease
}
#dot.wide{width:52px;height:52px;margin:-26px 0 0 -26px;background:rgba(244,242,239,.13);border-color:rgba(244,242,239,.72)}
@media(hover:none),(pointer:coarse){#dot{display:none}}

@media(max-width:760px){
  #eyeZoom{width:112vw;height:60vh;top:43%}
  #eyePhoto{object-position:50% 50%}
  .eye-copy{bottom:calc(9vh + var(--safe-bottom))}
  .eye-copy h1{font-size:clamp(39px,10.2vw,57px)}
  #world{top:36.5%}
  .globe-hint{top:calc(36.5% + 38vw)}
  .story{grid-template-columns:46px 1fr;gap:11px;min-height:184px}
  .story-copy{grid-column:2}
  .story h2{font-size:24px}
  .story-copy{font-size:11.5px}
  .story-copy small{display:none}
  .plate{width:calc(100vw - 24px)}
  .lbmeta{grid-template-columns:1fr;gap:9px}
}
@media(max-width:390px){
  .header{padding-top:calc(18px + var(--safe-top))}
  .brand{font-size:27px}
  .try{padding:0 14px}
  #eyeZoom{width:118vw;height:58vh}
  .eye-copy h1{font-size:39px}
  .story h2{font-size:22px}
}
@media(max-height:560px) and (orientation:landscape){
  #eyeZoom{height:92vh;width:76vw}
  .eye-copy{display:none}
  #world{top:37%}
  .story{min-height:98px}
  .story-copy{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.12s!important}
}
</style>
</head>
<body>
<div id="scrollTrack"></div>

<main id="scene">
  <header class="header">
    <a class="brand" href="#" id="home">Ana</a>
    <a class="try" href="/?auth=login">Try Ana</a>
  </header>

  <section id="eyeScreen" aria-label="Enter Ana">
    <div id="eyeZoom">
      <img id="eyePhoto"
        src="https://images.pexels.com/photos/27915894/pexels-photo-27915894/free-photo-of-a-close-up-of-a-woman-s-eye-with-a-black-background.jpeg?auto=compress&cs=tinysrgb&w=1600"
        alt="Close-up human eye">
      <div class="eyeMask"></div>
      <div class="eyeGlow"></div>
    </div>
    <div class="eye-copy">
      <h1>Language shouldn’t get in the way.</h1>
      <p>Scroll to enter Ana</p>
    </div>
  </section>

  <section id="globeScreen" aria-label="Explore Ana">
    <div id="world"><div id="orb"></div></div>
    <div class="globe-hint">Drag the globe · tap a photograph</div>

    <div id="story">
      <article class="story" id="storyCard">
        <div>
          <div class="count"><span id="storyNo">01</span> / <span id="storyTotal">16</span></div>
          <div class="progress"><i id="storyProgress"></i></div>
        </div>
        <div>
          <div class="kicker" id="storyKicker"></div>
          <h2 id="storyTitle"></h2>
        </div>
        <div class="story-copy">
          <span id="storyText"></span>
          <small>Tap the highlighted photograph to open it</small>
        </div>
      </article>
    </div>
  </section>

  <div class="vig"></div>
</main>

<div id="lightbox" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="plate">
    <div class="shot">
      <img id="lbImg" alt="">
      <button class="close" data-close>Close</button>
    </div>
    <div class="lbmeta">
      <div><h2 id="lbTitle"></h2><small id="lbKicker"></small></div>
      <p id="lbText"></p>
    </div>
  </div>
</div>

<div id="dot"></div>

<script>
(function(){
"use strict";

var ITEMS=[
["ANA","Language shouldn’t get in the way.","Ana helps you write, translate, reply and understand the world around you — without changing how you already communicate.","19682344/pexels-photo-19682344.jpeg"],
["TRANSLATE TEXT","Translate what you mean.","Type, paste or dictate. Ana focuses on natural meaning in the target language rather than mechanical word-for-word replacement.","3769138/pexels-photo-3769138.jpeg"],
["WRITE FOR ME","Tell Ana the thought. Ana writes it.","Start with a rough thought, a few words or just the point you want to make. Ana turns it into a ready-to-send message, email or note.","261949/pexels-photo-261949.jpeg"],
["REPLY","Reply without leaving the conversation.","Use selected or copied context, review Ana’s suggested answer and paste it back where the conversation is already happening.","19474421/pexels-photo-19474421.jpeg"],
["CORRECT","Correct the sentence. Or the whole paragraph.","Ana fixes spelling, grammar, wording and clarity while keeping the meaning, terminology and tone you intended.","4050291/pexels-photo-4050291.jpeg"],
["PDF · WORD","Translate documents without destroying them.","Translate PDF and Word while preserving headings, tables, images, headers and the visual structure wherever possible.","92631/pexels-photo-92631.jpeg"],
["CAMERA","Point. Translate. Understand.","Use Ana for signs, menus, notices, labels and other text inside pictures. The translation stays connected to what you were looking at.","18240395/pexels-photo-18240395.jpeg"],
["MEETING LISTEN","Stay in the meeting.","Ana can follow longer conversations with live transcription and translation so a language change does not make you lose the discussion.","8133989/pexels-photo-8133989.jpeg"],
["TALK FOR ME · EARLY ACCESS","Let Ana help carry the conversation.","Useful for routine back-and-forth while important choices, commitments and decisions stay with you.","7108327/pexels-photo-7108327.jpeg"],
["PRIVACY","Useful when you ask. Quiet when you don’t.","Normal typing can stay local. Sensitive fields and explicit controls decide when cloud AI is used.","4260314/pexels-photo-4260314.jpeg"],
["ANA API","Bring Ana into your own workflow.","Selected Ana language capabilities can also sit inside an existing product, internal tool or business process.","5483077/pexels-photo-5483077.jpeg"],
["DOCUMENT TRANSLATION","Your document. Still your document.","Ana keeps structure and visual hierarchy connected to the translated content instead of turning the document into a plain text dump.","8970674/pexels-photo-8970674.jpeg"],
["PICTURE TRANSLATION","Translate what is in front of you.","Compare original and translated views, inspect small text and keep translated content connected to where it appeared.","9798546/pexels-photo-9798546.jpeg"],
["REPLY · WRITE · TRANSLATE","Know what the message says. Know what to say back.","Ana turns understanding and response into one flow instead of making you jump between separate tools.","7342998/pexels-photo-7342998.jpeg"],
["LIVE & MEETINGS","Language changes. The meeting keeps moving.","Live translation, transcript and meeting notes are designed to keep you with the conversation rather than behind it.","7433900/pexels-photo-7433900.jpeg"],
["ANA","Communicate without changing how you work.","Type, speak, copy, photograph, upload, listen and reply. Ana is the language layer around the way you already communicate.","3885587/pexels-photo-3885587.jpeg"]
].map(function(x){
  return {
    kicker:x[0],title:x[1],text:x[2],
    thumb:"https://images.pexels.com/photos/"+x[3]+"?auto=compress&cs=tinysrgb&w=700",
    full:"https://images.pexels.com/photos/"+x[3]+"?auto=compress&cs=tinysrgb&w=1600"
  };
});

var eyeScreen=document.getElementById("eyeScreen");
var eyeZoom=document.getElementById("eyeZoom");
var globe=document.getElementById("globeScreen");
var world=document.getElementById("world");
var orb=document.getElementById("orb");
var storyCard=document.getElementById("storyCard");
var storyNo=document.getElementById("storyNo");
var storyTotal=document.getElementById("storyTotal");
var storyProgress=document.getElementById("storyProgress");
var storyKicker=document.getElementById("storyKicker");
var storyTitle=document.getElementById("storyTitle");
var storyText=document.getElementById("storyText");
var lightbox=document.getElementById("lightbox");
var plate=lightbox.querySelector(".plate");
var lbImg=document.getElementById("lbImg");
var lbTitle=document.getElementById("lbTitle");
var lbKicker=document.getElementById("lbKicker");
var lbText=document.getElementById("lbText");
var dot=document.getElementById("dot");

storyTotal.textContent=String(ITEMS.length).padStart(2,"0");

var N=ITEMS.length;
var GA=Math.PI*(3-Math.sqrt(5));
var cards=[],units=[];
var R=250,persp=1000,active=-1,pendingActive=-1;
var baseYaw=0,basePitch=-4,dragYaw=0,dragPitch=0,velYaw=0,velPitch=0;
var dragging=null,rafPending=false,inertiaId=0,opened=-1,sourceCard=null;
var lastW=innerWidth,lastH=innerHeight;

function build(){
  ITEMS.forEach(function(item,i){
    var c=document.createElement("div");
    c.className="photo-card";
    c.dataset.idx=String(i);
    c.innerHTML='<figure><img loading="'+(i<3?'eager':'lazy')+'" decoding="async" src="'+item.thumb+'" alt="'+item.title.replace(/"/g,"&quot;")+'"></figure>';
    orb.appendChild(c);
    cards.push(c);

    var y=1-(i/(N-1))*2;
    var rad=Math.sqrt(Math.max(0,1-y*y));
    var theta=i*GA;
    var x=Math.cos(theta)*rad;
    var z=Math.sin(theta)*rad;
    units.push({
      x:x,y:y,z:z,
      lat:Math.asin(y)*180/Math.PI,
      lon:Math.atan2(x,z)*180/Math.PI
    });
  });
}

function layout(force){
  var w=innerWidth,h=innerHeight;
  if(!force&&Math.abs(w-lastW)<20&&Math.abs(h-lastH)<20)return;
  lastW=w;lastH=h;

  var hr=w<=390?.33:w<=640?.37:.43;
  var wr=w<=390?.42:w<=640?.47:.55;
  var floor=w<=390?100:w<=640?116:150;
  R=Math.max(floor,Math.min(445,h*hr,w*wr));

  var scale=w<=390?.42:w<=640?.44:.47;
  document.documentElement.style.setProperty("--cw",Math.round(Math.max(68,R*scale))+"px");

  persp=w<=390?620:w<=640?760:w<=900?900:1000;
  document.documentElement.style.setProperty("--persp",persp+"px");

  units.forEach(function(u,i){
    cards[i].style.transform=
      "translate3d("+(u.x*R).toFixed(1)+"px,"+
      (-u.y*R).toFixed(1)+"px,"+
      (u.z*R).toFixed(1)+"px) rotateY("+
      u.lon.toFixed(2)+"deg) rotateX("+u.lat.toFixed(2)+"deg)";
  });

  scheduleRender();
}

function scrollState(){
  var h=innerHeight,y=scrollY;
  return {
    y:y,
    eyeEnd:h*1.35,
    storyStart:h*1.12,
    step:h*.53
  };
}

function swapStory(i){
  if(i===active||i===pendingActive)return;
  pendingActive=i;
  storyCard.classList.add("swap");

  setTimeout(function(){
    active=i;
    pendingActive=-1;

    cards.forEach(function(c,j){c.classList.toggle("active",j===i)});
    var item=ITEMS[i];

    storyNo.textContent=String(i+1).padStart(2,"0");
    storyKicker.textContent=item.kicker;
    storyTitle.textContent=item.title;
    storyText.textContent=item.text;
    storyProgress.style.transform="scaleX("+((i+1)/N)+")";

    var u=units[i];
    baseYaw=-u.lon;
    basePitch=Math.max(-24,Math.min(24,u.lat*.65));

    storyCard.classList.remove("swap");
    scheduleRender();
  },105);
}

function depth(u,pitch,yaw){
  var x=u.x,y=-u.y,z=u.z;
  var rx=pitch*Math.PI/180,ry=yaw*Math.PI/180;
  var cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry);
  var y1=y*cx-z*sx;
  var z1=y*sx+z*cx;
  return -x*sy+z1*cy;
}

function render(){
  rafPending=false;

  var s=scrollState();
  var ep=Math.max(0,Math.min(1,s.y/s.eyeEnd));

  var zoom=1+Math.pow(ep,1.72)*11.5;
  eyeZoom.style.transform="translate(-50%,-50%) scale("+zoom.toFixed(3)+")";

  var eyeFade=Math.max(0,Math.min(1,(ep-.57)/.31));
  eyeScreen.style.opacity=String(1-eyeFade);

  var globeOpacity=Math.max(0,Math.min(1,(ep-.59)/.22));
  globe.style.opacity=String(globeOpacity);
  globe.classList.toggle("visible",globeOpacity>.22);

  var storyIndex=s.y<s.storyStart?0:Math.floor((s.y-s.storyStart)/s.step);
  storyIndex=Math.max(0,Math.min(N-1,storyIndex));
  swapStory(storyIndex);

  var yaw=baseYaw+dragYaw;
  var pitch=Math.max(-32,Math.min(32,basePitch+dragPitch));

  world.style.transform="rotateY("+yaw.toFixed(2)+"deg) rotateX("+pitch.toFixed(2)+"deg)";

  cards.forEach(function(card,i){
    var zf=depth(units[i],pitch,yaw);
    var d=(zf+1)/2;
    var dim=1-(.16+.84*Math.pow(d,.84));
    var opacity=.18+.82*d;

    if(i===active){
      dim=Math.max(0,dim-.24);
      opacity=1;
    }
    if(document.body.classList.contains("lightbox")&&i===opened)opacity=0;

    card.style.opacity=opacity.toFixed(3);
    card.style.setProperty("--d",Math.max(0,Math.min(1,dim)).toFixed(3));
  });
}

function scheduleRender(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(render);
}

function stopInertia(){
  if(inertiaId){
    cancelAnimationFrame(inertiaId);
    inertiaId=0;
  }
}

function startInertia(){
  stopInertia();
  function tick(){
    dragYaw+=velYaw;
    dragPitch+=velPitch;
    velYaw*=.91;
    velPitch*=.91;
    scheduleRender();

    if(Math.abs(velYaw)>.015||Math.abs(velPitch)>.015){
      inertiaId=requestAnimationFrame(tick);
    }else{
      inertiaId=0;
    }
  }
  inertiaId=requestAnimationFrame(tick);
}

function openItem(i,source){
  if(document.body.classList.contains("lightbox"))return;

  opened=i;
  sourceCard=source;
  var item=ITEMS[i];

  lbImg.src=item.full;
  lbImg.alt=item.title;
  lbTitle.textContent=item.title;
  lbKicker.textContent=item.kicker;
  lbText.textContent=item.text;

  var sr=source.getBoundingClientRect();

  document.body.classList.add("lightbox");
  lightbox.setAttribute("aria-hidden","false");
  scheduleRender();

  requestAnimationFrame(function(){
    var pr=plate.getBoundingClientRect();
    var dx=(sr.left+sr.width/2)-(pr.left+pr.width/2);
    var dy=(sr.top+sr.height/2)-(pr.top+pr.height/2);
    var sc=Math.max(.04,sr.width/Math.max(1,pr.width));

    plate.style.transition="none";
    plate.style.transform="translate("+dx+"px,"+dy+"px) scale("+sc+")";
    plate.style.opacity="0";
    plate.offsetHeight;

    requestAnimationFrame(function(){
      plate.style.transition="";
      plate.style.transform="";
      plate.style.opacity="";
    });
  });
}

function closeItem(){
  if(!document.body.classList.contains("lightbox"))return;

  var sr=sourceCard?sourceCard.getBoundingClientRect():null;
  var pr=plate.getBoundingClientRect();

  document.body.classList.remove("lightbox");
  lightbox.setAttribute("aria-hidden","true");

  if(sr){
    var dx=(sr.left+sr.width/2)-(pr.left+pr.width/2);
    var dy=(sr.top+sr.height/2)-(pr.top+pr.height/2);
    var sc=Math.max(.04,sr.width/Math.max(1,pr.width));

    plate.style.transition="transform .52s var(--ease),opacity .32s ease";
    plate.style.transform="translate("+dx+"px,"+dy+"px) scale("+sc+")";
    plate.style.opacity="0";
  }

  setTimeout(function(){
    plate.style.transition="none";
    plate.style.transform="";
    plate.style.opacity="";
    plate.offsetHeight;
    plate.style.transition="";
    opened=-1;
    scheduleRender();
  },540);
}

globe.addEventListener("pointerdown",function(e){
  if(document.body.classList.contains("lightbox"))return;

  stopInertia();

  var card=e.target.closest(".photo-card");
  dragging={
    id:e.pointerId,
    x:e.clientX,y:e.clientY,
    lx:e.clientX,ly:e.clientY,
    moved:0,
    card:card,
    touch:e.pointerType==="touch",
    captured:false
  };

  globe.classList.add("dragging");

  if(!dragging.touch){
    try{
      globe.setPointerCapture(e.pointerId);
      dragging.captured=true;
    }catch(_){}
  }
});

globe.addEventListener("pointermove",function(e){
  if(!dragging||dragging.id!==e.pointerId)return;

  var tx=e.clientX-dragging.x;
  var ty=e.clientY-dragging.y;
  var dist=Math.hypot(tx,ty);
  dragging.moved=Math.max(dragging.moved,dist);

  if(dragging.touch&&!dragging.captured){
    if(dist<10)return;

    if(Math.abs(ty)>Math.abs(tx)*1.15){
      dragging=null;
      globe.classList.remove("dragging");
      return;
    }

    try{
      globe.setPointerCapture(e.pointerId);
      dragging.captured=true;
    }catch(_){}
  }

  var dx=e.clientX-dragging.lx;
  var dy=e.clientY-dragging.ly;

  dragging.lx=e.clientX;
  dragging.ly=e.clientY;

  dragYaw+=dx*.12;
  dragPitch+=dy*.12;
  velYaw=dx*.12;
  velPitch=dy*.12;

  scheduleRender();

  if(dragging.touch&&dragging.captured)e.preventDefault();
},{passive:false});

globe.addEventListener("pointerup",function(e){
  if(!dragging||dragging.id!==e.pointerId)return;

  var d=dragging;
  dragging=null;
  globe.classList.remove("dragging");

  var slop=matchMedia("(pointer:coarse)").matches?14:6;

  if(d.card&&d.moved<=slop){
    openItem(Number(d.card.dataset.idx),d.card);
  }else{
    startInertia();
  }
});

globe.addEventListener("pointercancel",function(){
  dragging=null;
  globe.classList.remove("dragging");
});

window.addEventListener("scroll",scheduleRender,{passive:true});
window.addEventListener("resize",function(){layout(false)},{passive:true});
window.addEventListener("orientationchange",function(){setTimeout(function(){layout(true)},220)});

lightbox.addEventListener("click",function(e){
  if(e.target.closest("[data-close]"))closeItem();
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeItem();
});

document.getElementById("home").addEventListener("click",function(e){
  e.preventDefault();
  scrollTo({top:0,behavior:"smooth"});
});

var fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
var mx=innerWidth/2,my=innerHeight/2,dx=mx,dy=my;

if(fine){
  window.addEventListener("pointermove",function(e){
    mx=e.clientX;
    my=e.clientY;
    dot.classList.toggle("wide",!!(e.target.closest&&e.target.closest(".photo-card,a,button")));
  },{passive:true});

  (function cursor(){
    dx+=(mx-dx)*.2;
    dy+=(my-dy)*.2;
    dot.style.transform="translate3d("+dx+"px,"+dy+"px,0)";
    requestAnimationFrame(cursor);
  })();
}

build();
layout(true);

active=0;
cards[0].classList.add("active");
storyNo.textContent="01";
storyKicker.textContent=ITEMS[0].kicker;
storyTitle.textContent=ITEMS[0].title;
storyText.textContent=ITEMS[0].text;
storyProgress.style.transform="scaleX("+(1/N)+")";
baseYaw=-units[0].lon;
basePitch=Math.max(-24,Math.min(24,units[0].lat*.65));

scheduleRender();
})();
</script>
